<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fabrique Futur</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0d1017" />
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1017; --tx: #e8ecf5; --tx2: #9aa6bf; --accent: #4cc9f0;
        --f: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg); color: var(--tx); font: 16px/1.55 var(--f);
        -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 32px;
      }
      main { max-width: 30rem; width: 100%; }
      h1 { margin: 0 0 10px; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--tx2); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1 id="h">Taking you to Loco…</h1>
      <p id="p">If nothing happens, <a id="a" href="/loco-share/">open Loco</a>.</p>
    </main>
    <script>
      // Loco moved off this root onto the project page /loco-share/. Every link
      // written down before the move — a trip, a person, a legal page, a v1
      // ?t=/?f= token — arrives here, because those paths no longer exist at the
      // root. Send each one to the same address under /loco-share/ so it keeps
      // working. Anything else is an honest 404.
      (function () {
        var path = location.pathname.replace(/\/{2,}/g, "/");
        var q = new URLSearchParams(location.search);
        var moved = /^\/(t|u|legal)(\/|$)/.test(path);
        var carries = q.has("t") || q.has("f") || q.has("k");
        if (moved || carries) {
          var to = "/loco-share" + (moved ? path : "/") + location.search + location.hash;
          document.getElementById("a").href = to;
          location.replace(to);
          return;
        }
        document.getElementById("h").textContent = "Not here";
        document.getElementById("p").innerHTML =
          'Nothing lives at this address. <a href="/">Fabrique Futur</a> · <a href="/loco-share/">Loco</a>';
      })();
    </script>
  </body>
</html>
